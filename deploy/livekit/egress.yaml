api_key: __LIVEKIT_API_KEY__
api_secret: __LIVEKIT_API_SECRET__
ws_url: ws://127.0.0.1:7880

redis:
  address: 127.0.0.1:6379
  password: __REDIS_PASSWORD__

template_base: http://127.0.0.1:7980/
template_port: 7982
health_port: 7981
prometheus_port: 9090
insecure: true
disallow_local_storage: true

session_limits:
  file_output_max_duration: 2h
  file_output_max_size: 21474836480

storage:
  prefix: recordings/
  generate_presigned_url: false
  s3:
    access_key: __R2_ACCESS_KEY_ID__
    secret: __R2_SECRET_ACCESS_KEY__
    region: auto
    endpoint: https://27940cd0d92bb3f03943a5378ccf68d3.eu.r2.cloudflarestorage.com
    bucket: praximo-prod-r2
    force_path_style: true

cpu_cost:
  max_cpu_utilization: 0.8
  max_memory: 14
  memory_source: cgroup
  memory_kill_grace_sec: 3

logging:
  level: info
  json: true
