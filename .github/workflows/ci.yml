name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The floor for every job: read the code and nothing else. One job widens it by a
# single scope, below.
permissions:
  contents: read

jobs:
  # Which of the two verification jobs below needs a database, decided once so
  # both can read it. A schema-only Neon branch is not a cheap copy-on-write
  # child: Neon treats it as an independent root branch, so every run that
  # provisioned one added its full ~35 MB to the project's storage. On the Free
  # plan's 0.5 GB that is the whole budget after a day of pull requests, which is
  # why the branch is now provisioned only when the diff can affect the schema.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # On a pull request `paths-filter` asks the API for the PR's file list rather
    # than diffing the checkout, and this repository's default token is
    # `contents: read` — so without this scope every pull request failed here with
    # "Resource not accessible by integration" while `push` runs, which diff
    # locally, passed. That is why the job landed green on `main` and reddened the
    # first PR after it.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      database: ${{ steps.filter.outputs.database }}
    steps:
      - uses: actions/checkout@v5

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            database:
              - 'packages/db/**'
              - 'scripts/db-reset.ts'
              - 'scripts/ci-neon-branch.ts'
              - 'turbo.json'
              - 'bun.lock'

  # Everything that needs no database, on every push and pull request.
  verify:
    runs-on: ubuntu-latest
    # The whole job normally finishes in ~2-3 minutes; this is a backstop
    # against a hung step, not a budget for legitimate work.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      # `@hugeicons-pro/*` resolves to the vendor's own registry (bunfig.toml);
      # without this token the fetch hangs indefinitely rather than failing
      # fast, which is what the dedicated timeout below now guards against.
      - run: bun install --frozen-lockfile
        timeout-minutes: 3
        env:
          UNIVERSAL_LICENSE_KEY: ${{ secrets.UNIVERSAL_LICENSE_KEY }}

      # Typecheck every workspace, then lint the whole tree.
      - run: bun run check

      # Every suite except `@praximo/db`'s, which the `database` job below owns.
      # The split is what keeps #136 true: the database suites are not *skipped*
      # here, they are not part of this job at all, so `test-database.ts` — where
      # a missing DATABASE_URL under CI is a failure — is never even imported.
      - run: bun run test:no-db

      # Bundles each Worker for workerd without deploying — the end-to-end
      # "it actually compiles for the target" gate.
      - run: bun run build

      - run: bun run format:check

      # A cancelled run can die between creating its branch and deleting it, so
      # the leftovers are reaped here rather than in the `database` job: this job
      # runs on every pull request, and one that changes no schema must still
      # sweep. Best-effort — a Neon hiccup here must not fail a PR.
      - name: Reap Neon branches left behind by cancelled runs
        if: always()
        continue-on-error: true
        run: bun scripts/ci-neon-branch.ts prune
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}

  # The `@praximo/db` suites, and the ephemeral database they need. Runs only
  # when the diff touches the schema, the migrations, the repository layer or the
  # provisioning scripts themselves — see the `changes` job for why.
  database:
    needs: changes
    if: needs.changes.outputs.database == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - run: bun install --frozen-lockfile
        timeout-minutes: 3
        env:
          UNIVERSAL_LICENSE_KEY: ${{ secrets.UNIVERSAL_LICENSE_KEY }}

      # The database the `@praximo/db` suites run against (#136). A schema-only
      # branch of the existing project: same neon-http driver as production, so
      # the "no interactive transactions" constraint the repository layer is
      # written around still holds. Exports a masked DATABASE_URL to the steps
      # below via $GITHUB_ENV.
      #
      # A pull request from a fork cannot read the secret and fails here. That is
      # the intended shape: no database means the suites cannot run, and #136 is
      # precisely about never letting "did not run" look like "passed".
      - name: Create this run's Neon branch
        id: neon-branch
        timeout-minutes: 3
        run: bun scripts/ci-neon-branch.ts create
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}

      # The same reset developers run: drop, replay `packages/db/migrations` from
      # *this checkout*, seed. That is what makes a PR whose migration contradicts
      # the code — a dropped index a live `on conflict` infers from — fail here.
      - name: Migrate the branch
        run: bun run db:reset
        env:
          # db:reset hard-refuses `prod`; this stage exists only to satisfy the guard.
          APP_STAGE: ci
          ADMIN_TELEGRAM_IDS: "700000000"

      # `CI` (always set by Actions) turns a missing DATABASE_URL into a failure
      # rather than a silent skip — see packages/db/src/test-database.ts.
      - run: bun run db:test

      # Last, and `always()` so the branch goes away whatever happened above —
      # including a failed test run. Best-effort like the prune: a transient Neon
      # error must not redden a PR whose code is fine; the next run's prune
      # reclaims whatever is left.
      - name: Delete this run's Neon branch
        if: always() && steps.neon-branch.outputs.branch_id != ''
        continue-on-error: true
        run: bun scripts/ci-neon-branch.ts delete
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_BRANCH_ID: ${{ steps.neon-branch.outputs.branch_id }}
