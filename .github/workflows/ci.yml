name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - run: bun install --frozen-lockfile

      # Typecheck every workspace, then lint the whole tree.
      - run: bun run check

      - run: bun run test

      # Bundles each Worker for workerd without deploying — the end-to-end
      # "it actually compiles for the target" gate.
      - run: bun run build

      - run: bun run format:check
