name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # The whole job normally finishes in ~1-1.5 minutes; this is a backstop
    # against a hung runner/step (observed: bun install stalling for over an
    # hour with no network-side indication), not a budget for legitimate work.
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      # Dedicated timeout: this step has hung indefinitely on a stalled
      # registry fetch with no error, well past what a lockfile-only install
      # ever takes; the job-level timeout above is the remaining backstop.
      - run: bun install --frozen-lockfile
        timeout-minutes: 3

      # Typecheck every workspace, then lint the whole tree.
      - run: bun run check

      - run: bun run test

      # Bundles each Worker for workerd without deploying — the end-to-end
      # "it actually compiles for the target" gate.
      - run: bun run build

      - run: bun run format:check
